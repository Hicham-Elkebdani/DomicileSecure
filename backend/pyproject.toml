[project]
name = "domicilesecure-backend"
version = "0.1.0"
description = "DomicileSecure — backend API, vision worker and ML pipeline"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC"]
ignore = [
  "B008",   # FastAPI dependency injection uses calls in defaults
  "RUF001", # French text legitimately contains typographic characters
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"training/**" = ["S311"]
"scripts/**" = ["S310", "S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: tests that train a small model (deselect with -m 'not slow')",
]
filterwarnings = [
  "ignore::DeprecationWarning:apscheduler.*",
  "ignore:Using .httpx. with .starlette.testclient.",  # upstream notice, harmless
]

[tool.coverage.run]
source = ["app", "vision", "worker"]
omit = ["app/cli.py", "worker/__main__.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
