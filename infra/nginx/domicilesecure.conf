# Reverse proxy for DomicileSecure. Replace securite.exemple.com, then run:
#   sudo certbot --nginx -d securite.exemple.com
# (certbot adds the `listen 443 ssl` block and the certificate paths).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=domicile_login:10m rate=10r/m;

server {
    listen 80;
    server_name securite.exemple.com;

    client_max_body_size 6m;   # face photos (MAX_UPLOAD_SIZE_MB=5) + margin
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Real-time channel (WebSocket)
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Brute-force protection in front of the application-level limiter
    location = /api/v1/auth/login {
        limit_req zone=domicile_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # API docs are disabled in production by the application itself.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }
}
